# Compiles the app and runs the unit tests on every fix branch and pull request.
#
# The maintenance bot writes fixes on fix/* branches. It cannot compile Kotlin
# on its own server, so this run is what tells it whether a fix builds and
# keeps the tests green before it is ever proposed.

name: verify

on:
  push:
    branches: ["fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The wrapper jar is not committed, so ./gradlew cannot run on a fresh
      # machine. Use the exact Gradle version the wrapper declares instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Unit tests and debug build
        run: gradle --no-daemon testDebugUnitTest assembleDebug
